; Matchday Conditions - settings
; Lines starting with ; or # are comments.

; Master switch (can also be toggled in-game with [1] on the sider overlay)
enabled = true

; Default climate for matches: temperate, cold, mediterranean, tropical, arid
profile = temperate

; north or south - southern leagues get their seasons shifted six months
hemisphere = north

; Calendar month used for the climate: auto (today's date) or 1-12.
; Set this to follow your Master League calendar instead of real time.
month = auto

; true = the same fixture on the same day always gets the same conditions
; (restarting a match will not reroll the weather; use [2] to reroll)
fixed_per_fixture = true

; Set to false if you never want snow
allow_snow = true

; 0 = off, 1 = default, 2 = force weather visuals (rain/snow particles)
weather_effects = 2

; Per-tournament overrides. Find the id in sider.log ("tournament=<id>")
; after playing a match in that competition.
;   tournament.<id> = <profile>
;   tournament.<id>.hemisphere = south
; Examples:
; tournament.17 = cold
; tournament.25 = tropical
; tournament.25.hemisphere = south
