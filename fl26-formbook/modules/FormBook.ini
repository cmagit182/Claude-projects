; FormBook settings. Lines starting with ; or # are comments.
; Results are stored in modules\FormBook\results.csv

; Record exhibition / friendly matches too (tournament id 65535)
record_exhibition = true

; How many recent results to show in the form guide (1-10)
form_length = 5

; ---------------------------------------------------------------
; Adaptive difficulty (can also be toggled in-game with [2])
; ---------------------------------------------------------------
adaptive = false

; Your team id, or auto = the team that appears in all of your last
; `window` recorded matches (works for Master League / Become a Legend /
; league mode). Team ids are written to results.csv and sider.log.
my_team = auto

; Results at the current difficulty that are evaluated (1-20)
window = 5
; Results needed at a difficulty before it may change (1-20)
min_matches = 3
; Points per game (win 3, draw 1) needed to step up / at or below which to step down
promote_ppg = 2.4
demote_ppg = 0.8
; Allowed range: 0 Beginner, 1 Amateur, 2 Regular, 3 Professional,
;                4 Top Player, 5 Super Star, 6 Legend
min_difficulty = 2
max_difficulty = 6

; ---------------------------------------------------------------
; Display names (sider only knows numeric ids). Ids appear in
; results.csv after your first match with that team / competition.
; ---------------------------------------------------------------
; team.101 = Arsenal
; team.103 = Chelsea
; tournament.17 = Premier League
